<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Home</title>

</head>

<body>

    <h1>Welcome Home</h1>

    <p>You are logged in.</p>

    <button id="logout">
        Logout
    </button>


    <script>

        document
            .getElementById("logout")
            .addEventListener("click", async () => {

                const response = await fetch(
                    "/api/auth/logout",
                    {
                        method: "POST"
                    }
                );


                if (response.ok) {

                    window.location.href =
                        "/login";

                }

            });

    </script>

</body>

</html>
