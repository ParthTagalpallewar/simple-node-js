services:

  node:
    build: .
    container_name: node-app
    image: parth11072003/mynodeapp:${TAG:-latest}
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    container_name: mongodb
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: