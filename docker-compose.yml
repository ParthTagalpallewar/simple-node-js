services:

  node:
    build: .
    container_name: node-app
    image: parth11072003/mynodeapp:${TAG:-latest}
    ports:
      - "${HOST_PORT:-5000}:3000"
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    container_name: mongodb
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: